<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WarungKu</title><style>
:root{font-family:system-ui,sans-serif;--bg:#f5f7fb;--surface:#fff;--surface2:#eef2f7;--text:#172033;--muted:#667085;--line:#dfe4ec;--accent:#2563eb;--danger:#dc2626;--warn:#d97706;--ok:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 15px 50px #0002}.brand{font-size:28px;font-weight:800}.sub{color:var(--muted);margin:5px 0 24px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);outline:none}.primary{background:var(--accent);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700}.full{width:100%}.err{color:var(--danger);min-height:20px;font-size:13px}.shell{display:flex;min-height:100vh}.side{width:225px;background:var(--surface);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column}.logo{font-size:22px;font-weight:800;margin:5px 8px 22px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);padding:12px;border-radius:11px;margin:2px 0}.nav button.active,.nav button:hover{background:var(--surface2);color:var(--text)}.logout{margin-top:auto;background:var(--surface2);padding:11px;border-radius:11px}.main{flex:1;padding:18px;min-width:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.title{font-size:25px;font-weight:800}.content{max-width:1150px}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.prod{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:left}.prod:disabled{opacity:.4}.prod b{display:block}.prod span{font-size:12px;color:var(--muted)}.cartitems{min-height:150px}.cartrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.cartrow small{display:block;color:var(--muted)}.qty button{width:28px;height:28px;border-radius:8px;background:var(--surface2)}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:13px 0}.paybox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.change{font-size:13px;font-weight:700;margin-top:6px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:10px}.secondary{background:var(--surface2);color:var(--text);padding:10px 13px;border-radius:10px}.danger{background:var(--danger);color:#fff;padding:9px;border-radius:9px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.label{font-size:12px;color:var(--muted)}.value{font-size:21px;font-weight:800;margin-top:4px}.badge{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#16a34a22;color:var(--ok)}.warn{background:#d9770622;color:var(--warn)}.bad{background:#dc262622;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:28px}.notice{padding:12px;border-radius:12px;background:#dc262615;color:var(--danger);margin-bottom:10px}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:var(--surface2);padding:7px 10px;border-radius:9px}.toast{position:fixed;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);padding:13px 15px;border-radius:12px;box-shadow:0 8px 30px #0003;z-index:10}@media(max-width:850px){.side{width:66px;padding:9px}.logo{font-size:0;text-align:center}.logo:after{content:'🛒';font-size:24px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:19px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.main{padding:12px}.products{grid-template-columns:1fr 1fr}.paybox{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.title{font-size:21px}}
</style></head><body><div id="root" class="app"></div><script>
const KEY='warungku_v11';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{admin:{user:'admin',pass:'1234'},store:{name:'WarungKu',address:'',phone:''},products:[{id:1,name:'Mie Instan',price:3500,cost:2500,stock:20,min:5},{id:2,name:'Kopi Sachet',price:2500,cost:1500,stock:15,min:5},{id:3,name:'Teh Botol',price:4000,cost:2500,stock:10,min:3}],sales:[],expenses:[]};db.store??={name:'WarungKu',address:'',phone:''};db.sales??=[];db.expenses??=[];db.products.forEach(p=>{p.cost??=0;p.min??=3});let page='kasir',cart=[],query='';const rup=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const today=()=>new Date().toISOString().slice(0,10);const low=()=>db.products.filter(p=>p.stock<=p.min);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const root=()=>document.getElementById('root');
function login(){root().innerHTML='<div class="login"><div class="loginbox"><div class="brand">🛒 WarungKu</div><div class="sub">Kasir sederhana untuk warung</div><div class="field"><label>Username</label><input id="u" value="admin"></div><div class="field"><label>Password</label><input id="p" type="password" value="1234"></div><div id="e" class="err"></div><button class="primary full" onclick="doLogin()">Masuk</button><div style="font-size:12px;color:var(--muted);margin-top:15px">Awal: admin / 1234</div></div></div>'}function doLogin(){if(u.value===db.admin.user&&p.value===db.admin.pass){sessionStorage.setItem('wk','1');render()}else e.textContent='Username atau password salah.'}function nav(x){page=x;query='';render()}
function shell(){let n=low().length,t={kasir:'Kasir',produk:'Produk & Stok',laporan:'Laporan Penjualan',riwayat:'Riwayat Transaksi',notifikasi:'Notifikasi Stok',pengaturan:'Pengaturan'}[page]||'Kasir';root().innerHTML='<div class="shell"><aside class="side"><div class="logo">🛒 WarungKu</div><div class="nav"><button class="'+(page==='kasir'?'active':'')+'" onclick="nav(\'kasir\')">🛒 Kasir</button><button class="'+(page==='produk'?'active':'')+'" onclick="nav(\'produk\')">📦 Produk & Stok</button><button class="'+(page==='laporan'?'active':'')+'" onclick="nav(\'laporan\')">📊 Laporan</button><button class="'+(page==='riwayat'?'active':'')+'" onclick="nav(\'riwayat\')">🧾 Riwayat</button><button class="'+(page==='notifikasi'?'active':'')+'" onclick="nav(\'notifikasi\')">🔔 Stok '+(n?'('+n+')':'')+'</button><button class="'+(page==='pengaturan'?'active':'')+'" onclick="nav(\'pengaturan\')">⚙️ Pengaturan</button></div><button class="logout" onclick="sessionStorage.removeItem(\'wk\');login()">Keluar</button></aside><main class="main"><div class="top"><div><div class="title">'+t+'</div><div style="color:var(--muted);font-size:12px">'+new Date().toLocaleDateString('id-ID',{dateStyle:'full'})+'</div></div>'+(n?'<button class="secondary" onclick="nav(\'notifikasi\')">🔔 '+n+' stok perlu dicek</button>':'')+'</div><div class="content" id="content"></div></main></div>'}
function render(){if(!sessionStorage.getItem('wk'))return login();shell();({kasir,produk,laporan,riwayat,notifikasi,pengaturan}[page]||kasir)()}
function updateChange(v){let total=cart.reduce((a,c)=>a+c.price*c.qty,0),m=Number(v||0),el=document.getElementById('changeInfo');if(!el)return;if(!m){el.textContent='Kembalian: Rp 0';el.style.color='var(--muted)';return}if(m<total){el.textContent='Kurang: '+rup(total-m);el.style.color='var(--danger)'}else{el.textContent='Kembalian: '+rup(m-total);el.style.color='var(--ok)'}}
function kasir(){let ps=db.products.filter(p=>p.name.toLowerCase().includes(query.toLowerCase())),total=cart.reduce((a,c)=>a+c.price*c.qty,0);content.innerHTML='<div class="grid"><section class="panel"><input class="search" placeholder="🔍 Cari barang..." value="'+query.replaceAll('"','&quot;')+'" oninput="query=this.value;kasir()"><div class="products">'+ps.map(p=>'<button class="prod" '+(p.stock===0?'disabled':'')+' onclick="add('+p.id+')"><b>'+p.name+'</b><span>'+rup(p.price)+' · Stok '+p.stock+'</span></button>').join('')+'</div></section><section class="panel"><h3 style="margin-top:0">Keranjang</h3><div class="cartitems">'+(cart.length?cart.map(c=>'<div class="cartrow"><div><b>'+c.name+'</b><small>'+rup(c.price)+' × '+c.qty+'</small></div><div class="qty"><button onclick="chg('+c.id+',-1)">−</button> '+c.qty+' <button onclick="chg('+c.id+',1)">+</button></div></div>').join(''):'<div class="empty">Belum ada barang</div>')+'</div><div class="total"><span>Total</span><span>'+rup(total)+'</span></div><div class="paybox"><div><input class="search" id="cash" type="number" min="0" inputmode="numeric" placeholder="Uang pembayaran" oninput="updateChange(this.value)"><div id="changeInfo" class="change">Kembalian: Rp 0</div></div><button class="primary" onclick="pay()">💳 Bayar</button></div></section></div>'}
function add(id){let p=db.products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(!p||p.stock<1)return;if(c){if(c.qty<p.stock)c.qty++;else toast('Stok tidak cukup')}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});kasir()}function chg(id,d){let c=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!c||!p)return;c.qty=Math.min(p.stock,c.qty+d);if(c.qty<=0)cart=cart.filter(x=>x.id!==id);kasir()}
function pay(){let total=cart.reduce((a,c)=>a+c.price*c.qty,0),m=Number(document.getElementById('cash')?.value);if(!cart.length)return toast('Keranjang masih kosong');if(!Number.isFinite(m)||m<=0)return toast('Masukkan uang pembayaran');if(m<total)return toast('Uang pembayaran kurang');let items=cart.map(c=>({...c}));items.forEach(c=>{let p=db.products.find(p=>p.id===c.id);if(p)p.stock-=c.qty});let s={id:Date.now(),date:today(),time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),items,total,money:m,change:m-total};db.sales.push(s);save();cart=[];render();receipt(s.id,'kasir');toast('Transaksi berhasil')}
function produk(){let ps=db.products.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));content.innerHTML='<div class="panel"><div class="toolbar"><input class="search" placeholder="🔍 Cari produk..." value="'+query.replaceAll('"','&quot;')+'" oninput="query=this.value;produk()"><button class="primary" onclick="openProduct()">＋ Tambah Produk</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th></th></tr></thead><tbody>'+ps.map(p=>'<tr><td><b>'+p.name+'</b></td><td>'+rup(p.price)+'</td><td>'+p.stock+'</td><td>'+(p.stock===0?'<span class="badge bad">HABIS</span>':p.stock<=p.min?'<span class="badge warn">MENIPIS</span>':'<span class="badge ok">AMAN</span>')+'</td><td><button class="secondary" onclick="openProduct('+p.id+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div>'}
function openProduct(id){let p=id?db.products.find(x=>x.id===id):{name:'',price:0,cost:0,stock:0,min:3};document.body.insertAdjacentHTML('beforeend','<div class="modalback" id="modal"><div class="modal"><div class="modalhead"><h3>'+(id?'Edit Produk':'Tambah Produk')+'</h3><button class="close" onclick="modal.remove()">×</button></div><div class="field"><label>Nama produk</label><input id="pn" value="'+p.name+'"></div><div class="field"><label>Harga jual</label><input id="pp" type="number" value="'+p.price+'"></div><div class="field"><label>Harga modal</label><input id="pc" type="number" value="'+p.cost+'"></div><div class="field"><label>Stok</label><input id="ps" type="number" value="'+p.stock+'"></div><div class="field"><label>Batas stok menipis</label><input id="pm" type="number" value="'+p.min+'"></div><button class="primary full" onclick="saveProduct('+(id||0)+')">Simpan</button>'+(id?'<button class="danger full" style="margin-top:8px" onclick="deleteProduct('+id+')">Hapus produk</button>':'')+'</div></div>')}
function saveProduct(id){let name=pn.value.trim(),price=Number(pp.value),cost=Number(pc.value),stock=Number(ps.value),min=Number(pm.value);if(!name||price<0||cost<0||stock<0)return toast('Data belum lengkap');if(id)Object.assign(db.products.find(p=>p.id===id),{name,price,cost,stock,min});else db.products.push({id:Date.now(),name,price,cost,stock,min});save();modal.remove();produk();toast('Produk disimpan')}function deleteProduct(id){if(confirm('Hapus produk ini?')){db.products=db.products.filter(p=>p.id!==id);save();modal.remove();produk();toast('Produk dihapus')}}
function laporan(){let s=db.sales.filter(x=>x.date===today()),om=s.reduce((a,x)=>a+x.total,0),qty=s.reduce((a,x)=>a+x.items.reduce((q,i)=>q+i.qty,0),0),cost=s.reduce((a,x)=>a+x.items.reduce((q,i)=>q+(db.products.find(p=>p.id===i.id)?.cost||0)*i.qty,0),0),ex=db.expenses.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0),profit=om-cost-ex;content.innerHTML='<div class="cards"><div class="card"><div class="label">Transaksi</div><div class="value">'+s.length+'</div></div><div class="card"><div class="label">Barang terjual</div><div class="value">'+qty+'</div></div><div class="card"><div class="label">Omzet</div><div class="value">'+rup(om)+'</div></div><div class="card"><div class="label">Laba bersih</div><div class="value">'+rup(profit)+'</div></div></div><div class="panel" style="margin-top:12px"><div class="toolbar"><h3>Ringkasan hari ini</h3><button class="secondary" onclick="openExpense()">＋ Pengeluaran</button></div><p style="color:var(--muted)">Modal: '+rup(cost)+' · Pengeluaran: '+rup(ex)+' · Laba: <b>'+rup(profit)+'</b></p><div class="tablewrap"><table class="table"><thead><tr><th>Waktu</th><th>Barang</th><th>Total</th><th></th></tr></thead><tbody>'+(s.slice().reverse().map(x=>'<tr><td>'+x.time+'</td><td>'+x.items.map(i=>i.name+' × '+i.qty).join(', ')+'</td><td><b>'+rup(x.total)+'</b></td><td><button class="secondary" onclick="receipt('+x.id+',\'laporan\')">🧾</button></td></tr>').join('')||'<tr><td colspan="4" class="empty">Belum ada transaksi.</td></tr>')+'</tbody></table></div></div>'}
function riwayat(){let s=db.sales.slice().reverse().filter(x=>(x.date+' '+x.items.map(i=>i.name).join(' ')).toLowerCase().includes(query.toLowerCase()));content.innerHTML='<div class="panel"><div class="toolbar"><input class="search" placeholder="🔍 Cari transaksi / tanggal..." value="'+query.replaceAll('"','&quot;')+'" oninput="query=this.value;riwayat()"><button class="secondary" onclick="exportData()">💾 Backup</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Tanggal</th><th>Waktu</th><th>Barang</th><th>Total</th><th></th></tr></thead><tbody>'+(s.map(x=>'<tr><td>'+x.date+'</td><td>'+x.time+'</td><td>'+x.items.map(i=>i.name+' × '+i.qty).join(', ')+'</td><td><b>'+rup(x.total)+'</b></td><td><button class="secondary" onclick="receipt('+x.id+',\'riwayat\')">🧾</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">Belum ada transaksi.</td></tr>')+'</tbody></table></div></div>'}
function notifikasi(){let a=low();content.innerHTML=a.length?'<div class="notice">⚠️ Ada '+a.length+' produk yang perlu diperiksa.</div><div class="panel"><table class="table"><thead><tr><th>Produk</th><th>Stok</th><th>Minimum</th><th>Status</th></tr></thead><tbody>'+a.map(p=>'<tr><td><b>'+p.name+'</b></td><td>'+p.stock+'</td><td>'+p.min+'</td><td>'+(p.stock===0?'<span class="badge bad">STOK HABIS</span>':'<span class="badge warn">STOK MENIPIS</span>')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="panel"><div class="empty">✅ Semua stok aman.</div></div>'}
function pengaturan(){content.innerHTML='<div class="grid"><section class="panel"><h3>Identitas Warung</h3><div class="field"><label>Nama warung</label><input id="sn" value="'+db.store.name+'"></div><div class="field"><label>Alamat</label><input id="sa" value="'+db.store.address+'"></div><div class="field"><label>No. telepon</label><input id="st" value="'+db.store.phone+'"></div><button class="primary full" onclick="saveSettings()">Simpan Identitas</button></section><section class="panel"><h3>Akun Admin</h3><div class="field"><label>Username</label><input id="au" value="'+db.admin.user+'"></div><div class="field"><label>Password baru</label><input id="ap" type="password" placeholder="Kosongkan jika tetap"></div><button class="primary full" onclick="saveAdmin()">Simpan Akun</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Data</h3><button class="secondary full" onclick="exportData()">💾 Backup Data</button><input id="restore" type="file" accept=".json" class="search" style="margin-top:8px" onchange="importData(this.files[0])"></section></div>'}
function saveSettings(){db.store={name:sn.value.trim()||'WarungKu',address:sa.value.trim(),phone:st.value.trim()};save();toast('Identitas disimpan');render()}function saveAdmin(){db.admin.user=au.value.trim()||'admin';if(ap.value.trim())db.admin.pass=ap.value.trim();save();toast('Akun diperbarui');render()}
function openExpense(){document.body.insertAdjacentHTML('beforeend','<div class="modalback" id="modal"><div class="modal"><div class="modalhead"><h3>Catat Pengeluaran</h3><button class="close" onclick="modal.remove()">×</button></div><div class="field"><label>Keterangan</label><input id="en" placeholder="Contoh: listrik"></div><div class="field"><label>Nominal</label><input id="ea" type="number" min="0"></div><button class="primary full" onclick="saveExpense()">Simpan</button></div></div>')}function saveExpense(){let n=en.value.trim(),a=Number(ea.value);if(!n||a<=0)return toast('Data belum lengkap');db.expenses.push({id:Date.now(),date:today(),name:n,amount:a});save();modal.remove();laporan();toast('Pengeluaran dicatat')}
function receipt(id,back){let s=db.sales.find(x=>x.id===id);if(!s)return;document.getElementById('receiptModal')?.remove();history.pushState({receipt:1},'',location.href.split('#')[0]+'#receipt');document.body.insertAdjacentHTML('beforeend','<div class="modalback" id="receiptModal"><div class="modal"><div class="modalhead"><h3>🧾 Struk Transaksi</h3><button class="close" onclick="closeReceipt()">×</button></div><div style="font-family:monospace;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:15px"><div style="text-align:center;font-weight:800;font-size:16px">'+db.store.name+'</div><div style="text-align:center;color:var(--muted);margin:4px 0 10px">'+(db.store.address||'')+(db.store.address&&db.store.phone?'<br>':'')+(db.store.phone||'')+'</div><div style="text-align:center;font-size:11px;color:var(--muted)">'+s.date+' '+s.time+' · #'+s.id+'</div><hr style="border:0;border-top:1px dashed var(--line)">'+s.items.map(i=>'<div style="margin:8px 0"><b>'+i.name+'</b><div style="display:flex;justify-content:space-between"><span>'+i.qty+' × '+rup(i.price)+'</span><span>'+rup(i.qty*i.price)+'</span></div></div>').join('')+'<hr style="border:0;border-top:1px dashed var(--line)"><div style="display:flex;justify-content:space-between"><b>TOTAL</b><b>'+rup(s.total)+'</b></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>TUNAI</span><span>'+rup(s.money||0)+'</span></div><div style="display:flex;justify-content:space-between;margin-top:6px;font-weight:800"><span>KEMBALIAN</span><span>'+rup(s.change||0)+'</span></div><div style="text-align:center;margin-top:14px">Terima kasih 🙏</div></div><button class="primary full" style="margin-top:10px" onclick="closeReceipt()">Kembali</button></div></div>');window._receiptBack=back||'kasir'}function closeReceipt(){document.getElementById('receiptModal')?.remove();history.replaceState(null,'',location.href.split('#')[0]);page=window._receiptBack||'kasir';render()}window.addEventListener('popstate',()=>{if(document.getElementById('receiptModal'))closeReceipt()});
function toast(t){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend','<div class="toast">'+t+'</div>');setTimeout(()=>document.querySelector('.toast')?.remove(),2400)}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='warungku-backup-'+today()+'.json';a.click()}function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.admin||!Array.isArray(x.products)||!Array.isArray(x.sales))throw 0;db=x;db.store??={name:'WarungKu',address:'',phone:''};db.expenses??=[];save();toast('Backup dipulihkan');render()}catch(e){toast('File backup tidak valid')}};r.readAsText(file)}render();
</script></body></html>
